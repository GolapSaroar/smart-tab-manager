<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab Manager - Organize Your Links</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #fafafa;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f5f5f5;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --text-tertiary: #999999;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-light: #dbeafe;
            --border: #e5e5e5;
            --success: #10b981;
            --danger: #ef4444;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --radius: 8px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Purple Theme */
        [data-theme="purple"] {
            --bg-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-secondary: #ffffff;
            --bg-tertiary: #f8f9fa;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --text-tertiary: #999999;
            --accent: #667eea;
            --accent-hover: #5568d3;
            --accent-light: #e0e7ff;
            --border: #e5e5e5;
        }

        /* Dark Theme */
        [data-theme="dark"] {
            --bg-primary: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #262626;
            --text-primary: #f5f5f5;
            --text-secondary: #a3a3a3;
            --text-tertiary: #737373;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --accent-light: rgba(59, 130, 246, 0.1);
            --border: #333333;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.5);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        /* Ocean Theme */
        [data-theme="ocean"] {
            --bg-primary: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --bg-secondary: #ffffff;
            --bg-tertiary: #f0f9ff;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --text-tertiary: #999999;
            --accent: #0ea5e9;
            --accent-hover: #0284c7;
            --accent-light: #e0f2fe;
            --border: #e5e5e5;
        }

        /* Sunset Theme */
        [data-theme="sunset"] {
            --bg-primary: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            --bg-secondary: #ffffff;
            --bg-tertiary: #fef3c7;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --text-tertiary: #999999;
            --accent: #f97316;
            --accent-hover: #ea580c;
            --accent-light: #ffedd5;
            --border: #e5e5e5;
        }

        /* Forest Theme */
        [data-theme="forest"] {
            --bg-primary: linear-gradient(135deg, #0ba360 0%, #3cba92 100%);
            --bg-secondary: #ffffff;
            --bg-tertiary: #f0fdf4;
            --text-primary: #1a1a1a;
            --text-secondary: #666666;
            --text-tertiary: #999999;
            --accent: #059669;
            --accent-hover: #047857;
            --accent-light: #d1fae5;
            --border: #e5e5e5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            transition: var(--transition);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .main-content {
            background: var(--bg-secondary);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
        }

        .header-left h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.25rem;
            letter-spacing: -0.02em;
        }

        .header-left p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .header-actions {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        /* Search Bar */
        .search-container {
            position: relative;
            margin-bottom: 2rem;
        }

        .search-input {
            width: 100%;
            padding: 0.875rem 1rem 0.875rem 2.75rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 0.95rem;
            font-family: inherit;
            background: var(--bg-secondary);
            transition: var(--transition);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-tertiary);
            pointer-events: none;
        }

        /* Buttons */
        .btn {
            padding: 0.625rem 1.25rem;
            border: none;
            border-radius: var(--radius);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--bg-tertiary);
        }

        .btn-icon {
            padding: 0.625rem;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Theme Switcher */
        .theme-switcher {
            position: relative;
        }

        .theme-select {
            padding: 0.625rem 2.5rem 0.625rem 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 0.9rem;
            font-family: inherit;
            cursor: pointer;
            transition: var(--transition);
            appearance: none;
        }

        .theme-select:hover {
            background: var(--bg-tertiary);
        }

        .theme-select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .theme-icon {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: var(--text-secondary);
        }

        /* Categories Grid */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .category-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            transition: var(--transition);
            border-left: 4px solid var(--accent);
        }

        .category-card:nth-child(6n+1) {
            border-left-color: #667eea;
        }

        .category-card:nth-child(6n+2) {
            border-left-color: #0ea5e9;
        }

        .category-card:nth-child(6n+3) {
            border-left-color: #f97316;
        }

        .category-card:nth-child(6n+4) {
            border-left-color: #059669;
        }

        .category-card:nth-child(6n+5) {
            border-left-color: #ec4899;
        }

        .category-card:nth-child(6n+6) {
            border-left-color: #8b5cf6;
        }

        .category-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        .category-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .category-count {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            padding: 0.25rem 0.625rem;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .category-actions {
            display: flex;
            gap: 0.5rem;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0.25rem;
            border-radius: 4px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        /* Links List */
        .links-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .link-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.625rem;
            border-radius: 6px;
            transition: var(--transition);
            cursor: pointer;
        }

        .link-item:hover {
            background: var(--bg-tertiary);
        }

        .link-favicon {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .link-content {
            flex: 1;
            min-width: 0;
        }

        .link-title {
            font-size: 0.9rem;
            color: var(--text-primary);
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .link-url {
            font-size: 0.8rem;
            color: var(--text-tertiary);
            font-family: 'JetBrains Mono', monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .link-remove {
            opacity: 0;
            transition: var(--transition);
        }

        .link-item:hover .link-remove {
            opacity: 1;
        }

        .add-link-btn {
            width: 100%;
            padding: 0.75rem;
            margin-top: 0.5rem;
            border: 1px dashed var(--border);
            background: transparent;
            color: var(--text-secondary);
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.9rem;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .add-link-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-light);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            box-shadow: var(--shadow-lg);
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .form-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 0.95rem;
            font-family: inherit;
            transition: var(--transition);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        .modal-actions {
            display: flex;
            gap: 0.75rem;
            justify-content: flex-end;
            margin-top: 1.5rem;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-state p {
            margin-bottom: 1rem;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            gap: 2rem;
            padding: 1.25rem 1.5rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 2rem;
        }

        .stat {
            display: flex;
            flex-direction: column;
        }

        .stat-value {
            font-size: 1.75rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 0.25rem;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Utility Classes */
        .hidden {
            display: none !important;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .header-actions {
                width: 100%;
                flex-wrap: wrap;
            }

            .categories-grid {
                grid-template-columns: 1fr;
            }

            .stats-bar {
                flex-direction: column;
                gap: 1rem;
            }
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .category-card {
            animation: fadeIn 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-content">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <h1>Tab Manager</h1>
                <p>Organize your links, reduce browser memory usage</p>
            </div>
            <div class="header-actions">
                <div class="theme-switcher">
                    <select class="theme-select" id="themeSelect" onchange="changeTheme()">
                        <option value="light">☀️ Light</option>
                        <option value="purple">💜 Purple</option>
                        <option value="dark">🌙 Dark</option>
                        <option value="ocean">🌊 Ocean</option>
                        <option value="sunset">🌅 Sunset</option>
                        <option value="forest">🌲 Forest</option>
                    </select>
                </div>
                <button class="btn btn-secondary" onclick="importData()">
                    <span>📥</span> Import
                </button>
                <button class="btn btn-secondary" onclick="exportData()">
                    <span>📤</span> Export
                </button>
                <button class="btn btn-primary" onclick="openCategoryModal()">
                    <span>➕</span> New Category
                </button>
            </div>
        </div>

        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stat">
                <div class="stat-value" id="categoryCount">0</div>
                <div class="stat-label">Categories</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="linkCount">0</div>
                <div class="stat-label">Total Links</div>
            </div>
        </div>

        <!-- Search -->
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input 
                type="text" 
                class="search-input" 
                id="searchInput" 
                placeholder="Search links and categories..."
                oninput="handleSearch()"
            >
        </div>

        <!-- Categories Grid -->
        <div class="categories-grid" id="categoriesGrid">
            <!-- Categories will be rendered here -->
        </div>

        <!-- Empty State -->
        <div class="empty-state hidden" id="emptyState">
            <div class="empty-state-icon">📂</div>
            <p>No categories yet. Create your first category to start organizing!</p>
            <button class="btn btn-primary" onclick="openCategoryModal()">Create Category</button>
        </div>
        </div>
    </div>

    <!-- Add/Edit Category Modal -->
    <div class="modal-overlay" id="categoryModal" onclick="closeModalOnOverlay(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <h2 class="modal-header" id="categoryModalTitle">New Category</h2>
            <div class="form-group">
                <label class="form-label">Category Name</label>
                <input 
                    type="text" 
                    class="form-input" 
                    id="categoryNameInput" 
                    placeholder="e.g., DSA, Git & GitHub, AI Resources"
                    onkeypress="handleEnterKey(event, 'category')"
                >
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeCategoryModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveCategory()">Save</button>
            </div>
        </div>
    </div>

    <!-- Add/Edit Link Modal -->
    <div class="modal-overlay" id="linkModal" onclick="closeModalOnOverlay(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <h2 class="modal-header">Add Link</h2>
            <div class="form-group">
                <label class="form-label">Link Title</label>
                <input 
                    type="text" 
                    class="form-input" 
                    id="linkTitleInput" 
                    placeholder="e.g., LeetCode - Arrays"
                    onkeypress="handleEnterKey(event, 'link', 'title')"
                >
            </div>
            <div class="form-group">
                <label class="form-label">URL</label>
                <input 
                    type="url" 
                    class="form-input" 
                    id="linkUrlInput" 
                    placeholder="https://example.com"
                    onkeypress="handleEnterKey(event, 'link', 'url')"
                >
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeLinkModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveLink()">Add Link</button>
            </div>
        </div>
    </div>

    <script>
        // Data Structure
        let categories = [];
        let currentCategoryId = null;
        let editingCategoryId = null;

        // Initialize
        function init() {
            loadData();
            loadTheme();
            renderCategories();
            updateStats();
        }

        // Theme Functions
        function loadTheme() {
            const savedTheme = localStorage.getItem('tabManagerTheme') || 'purple';
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.getElementById('themeSelect').value = savedTheme;
        }

        function changeTheme() {
            const theme = document.getElementById('themeSelect').value;
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('tabManagerTheme', theme);
        }

        // Local Storage
        function loadData() {
            const saved = localStorage.getItem('tabManagerData');
            if (saved) {
                categories = JSON.parse(saved);
            } else {
                // Default categories
                categories = [
                    {
                        id: generateId(),
                        name: 'DSA & Algorithms',
                        links: [
                            { id: generateId(), title: 'LeetCode', url: 'https://leetcode.com' },
                            { id: generateId(), title: 'NeetCode', url: 'https://neetcode.io' }
                        ]
                    },
                    {
                        id: generateId(),
                        name: 'Git & GitHub',
                        links: [
                            { id: generateId(), title: 'GitHub', url: 'https://github.com' },
                            { id: generateId(), title: 'Git Documentation', url: 'https://git-scm.com/doc' }
                        ]
                    },
                    {
                        id: generateId(),
                        name: 'Programming',
                        links: []
                    },
                    {
                        id: generateId(),
                        name: 'YouTube',
                        links: []
                    }
                ];
                saveData();
            }
        }

        function saveData() {
            localStorage.setItem('tabManagerData', JSON.stringify(categories));
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        // Render Functions
        function renderCategories(filteredCategories = null) {
            const grid = document.getElementById('categoriesGrid');
            const emptyState = document.getElementById('emptyState');
            const categoriesToRender = filteredCategories || categories;

            if (categoriesToRender.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            
            grid.innerHTML = categoriesToRender.map(category => `
                <div class="category-card" data-category-id="${category.id}">
                    <div class="category-header">
                        <div style="display: flex; align-items: center; gap: 0.5rem;">
                            <h3 class="category-title">${escapeHtml(category.name)}</h3>
                            <span class="category-count">${category.links.length}</span>
                        </div>
                        <div class="category-actions">
                            <button class="icon-btn" onclick="editCategory('${category.id}')" title="Edit category">
                                ✏️
                            </button>
                            <button class="icon-btn" onclick="deleteCategory('${category.id}')" title="Delete category">
                                🗑️
                            </button>
                        </div>
                    </div>
                    <div class="links-list">
                        ${category.links.length > 0 ? category.links.map(link => `
                            <div class="link-item" onclick="openLink('${link.url}')">
                                <img class="link-favicon" src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(link.url)}" alt="" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2214%22>🔗</text></svg>'">
                                <div class="link-content">
                                    <div class="link-title">${escapeHtml(link.title)}</div>
                                    <div class="link-url">${escapeHtml(link.url)}</div>
                                </div>
                                <button class="icon-btn link-remove" onclick="event.stopPropagation(); deleteLink('${category.id}', '${link.id}')" title="Remove link">
                                    ✕
                                </button>
                            </div>
                        `).join('') : '<div style="color: var(--text-tertiary); font-size: 0.9rem; padding: 1rem; text-align: center;">No links yet</div>'}
                    </div>
                    <button class="add-link-btn" onclick="openLinkModal('${category.id}')">
                        <span>➕</span> Add Link
                    </button>
                </div>
            `).join('');
        }

        function updateStats() {
            const totalLinks = categories.reduce((sum, cat) => sum + cat.links.length, 0);
            document.getElementById('categoryCount').textContent = categories.length;
            document.getElementById('linkCount').textContent = totalLinks;
        }

        // Category Functions
        function openCategoryModal(categoryId = null) {
            editingCategoryId = categoryId;
            const modal = document.getElementById('categoryModal');
            const title = document.getElementById('categoryModalTitle');
            const input = document.getElementById('categoryNameInput');

            if (categoryId) {
                const category = categories.find(c => c.id === categoryId);
                title.textContent = 'Edit Category';
                input.value = category.name;
            } else {
                title.textContent = 'New Category';
                input.value = '';
            }

            modal.classList.add('active');
            setTimeout(() => input.focus(), 100);
        }

        function closeCategoryModal() {
            document.getElementById('categoryModal').classList.remove('active');
            editingCategoryId = null;
        }

        function saveCategory() {
            const name = document.getElementById('categoryNameInput').value.trim();
            if (!name) {
                alert('Please enter a category name');
                return;
            }

            if (editingCategoryId) {
                const category = categories.find(c => c.id === editingCategoryId);
                category.name = name;
            } else {
                categories.push({
                    id: generateId(),
                    name: name,
                    links: []
                });
            }

            saveData();
            renderCategories();
            updateStats();
            closeCategoryModal();
        }

        function editCategory(categoryId) {
            openCategoryModal(categoryId);
        }

        function deleteCategory(categoryId) {
            const category = categories.find(c => c.id === categoryId);
            if (confirm(`Delete "${category.name}" and all its links?`)) {
                categories = categories.filter(c => c.id !== categoryId);
                saveData();
                renderCategories();
                updateStats();
            }
        }

        // Link Functions
        function openLinkModal(categoryId) {
            currentCategoryId = categoryId;
            const modal = document.getElementById('linkModal');
            document.getElementById('linkTitleInput').value = '';
            document.getElementById('linkUrlInput').value = '';
            modal.classList.add('active');
            setTimeout(() => document.getElementById('linkTitleInput').focus(), 100);
        }

        function closeLinkModal() {
            document.getElementById('linkModal').classList.remove('active');
            currentCategoryId = null;
        }

        function saveLink() {
            const title = document.getElementById('linkTitleInput').value.trim();
            const url = document.getElementById('linkUrlInput').value.trim();

            if (!title || !url) {
                alert('Please fill in both fields');
                return;
            }

            // Basic URL validation
            try {
                new URL(url);
            } catch {
                alert('Please enter a valid URL (include https://)');
                return;
            }

            const category = categories.find(c => c.id === currentCategoryId);
            category.links.push({
                id: generateId(),
                title: title,
                url: url
            });

            saveData();
            renderCategories();
            updateStats();
            closeLinkModal();
        }

        function deleteLink(categoryId, linkId) {
            const category = categories.find(c => c.id === categoryId);
            category.links = category.links.filter(l => l.id !== linkId);
            saveData();
            renderCategories();
            updateStats();
        }

        function openLink(url) {
            window.open(url, '_blank');
        }

        // Search
        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            
            if (!query) {
                renderCategories();
                return;
            }

            const filtered = categories.map(category => {
                const matchingLinks = category.links.filter(link => 
                    link.title.toLowerCase().includes(query) ||
                    link.url.toLowerCase().includes(query)
                );

                const categoryMatches = category.name.toLowerCase().includes(query);

                if (categoryMatches || matchingLinks.length > 0) {
                    return {
                        ...category,
                        links: categoryMatches ? category.links : matchingLinks
                    };
                }
                return null;
            }).filter(Boolean);

            renderCategories(filtered);
        }

        // Import/Export
        function exportData() {
            const dataStr = JSON.stringify(categories, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `tab-manager-backup-${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            URL.revokeObjectURL(url);
        }

        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'application/json';
            
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const imported = JSON.parse(event.target.result);
                        if (confirm('This will replace your current data. Continue?')) {
                            categories = imported;
                            saveData();
                            renderCategories();
                            updateStats();
                            alert('Data imported successfully!');
                        }
                    } catch (error) {
                        alert('Invalid file format');
                    }
                };
                reader.readAsText(file);
            };
            
            input.click();
        }

        // Utilities
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function closeModalOnOverlay(event) {
            if (event.target.classList.contains('modal-overlay')) {
                if (document.getElementById('categoryModal').classList.contains('active')) {
                    closeCategoryModal();
                }
                if (document.getElementById('linkModal').classList.contains('active')) {
                    closeLinkModal();
                }
            }
        }

        function handleEnterKey(event, type, field = null) {
            if (event.key === 'Enter') {
                if (type === 'category') {
                    saveCategory();
                } else if (type === 'link') {
                    if (field === 'title') {
                        document.getElementById('linkUrlInput').focus();
                    } else {
                        saveLink();
                    }
                }
            }
        }

        // Initialize on load
        init();
    </script>
</body>
</html>
